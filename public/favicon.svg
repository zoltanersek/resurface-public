<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OutpostLabs icon">
  <defs>
    <linearGradient id="sparkI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
  </defs>

  <!-- navy rounded tile (works as favicon / avatar on any background) -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0E1726"/>

  <!-- ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#E8EEF5" stroke-width="6.5"/>
  <!-- peak / caret -->
  <path d="M44 80 L64 52 L84 80" fill="none" stroke="#E8EEF5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- beacon glow + spark -->
  <circle cx="64" cy="45" r="13" fill="#FFB020" opacity="0.22"/>
  <path d="M64 35 L66 43 L73.5 45 L66 47 L64 55 L62 47 L54.5 45 L62 43 Z" fill="url(#sparkI)"/>
</svg>
